<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guillotine Playbook 2026</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--line:#2a2f3a;
  --tx:#e8eaef;--tx2:#9aa2b1;--tx3:#6b7382;--accent:#f0883e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 18px}
.topin{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
h1{font-size:17px;margin:0;letter-spacing:-.02em}
a.pill{background:#1d212a;border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12px;color:var(--tx2);text-decoration:none;white-space:nowrap}
a.pill:hover{color:var(--tx);border-color:#3d4250}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
.wrap h1,.wrap h2,.wrap h3{letter-spacing:-.02em;line-height:1.25}
.wrap h1{font-size:28px;margin:0 0 12px}
.wrap h2{font-size:20px;margin:36px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
.wrap h3{font-size:16px;margin:24px 0 8px;color:#d5dae3}
.wrap p,.wrap li{color:var(--tx2)}
.wrap strong{color:var(--tx);font-weight:600}
.wrap a{color:var(--accent)}
.wrap hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.wrap blockquote{margin:16px 0;padding:10px 14px;border-left:3px solid var(--accent);
  background:#171a21;color:var(--tx);border-radius:0 8px 8px 0}
.wrap table{width:100%;border-collapse:collapse;font-size:13.5px;margin:14px 0 22px}
.wrap th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx3);padding:8px 8px;border-bottom:1px solid var(--line)}
.wrap td{padding:8px;border-bottom:1px solid #232833;color:var(--tx2);vertical-align:top}
.wrap ul,.wrap ol{padding-left:22px}
.err{color:#f85149}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <h1>Guillotine Playbook</h1>
  <a class="pill" href="/">draft room</a>
</div></div>
<div class="wrap" id="md">Loading…</div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
fetch("/Guillotine-Playbook-2026.md")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { document.getElementById("md").innerHTML = marked.parse(t); })
  .catch(() => { document.getElementById("md").innerHTML = '<p class="err">Could not load the playbook.</p>'; });
</script>
</body>
</html>
