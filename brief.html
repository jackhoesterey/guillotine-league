<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly brief</title>
<style>
:root{--bg:#0f1115;--tx:#e8eaef;--tx2:#9aa2b1;--tx3:#6b7382;--line:#2a2f3a;--bad:#f85149;--accent:#f0883e}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
a{color:var(--tx2);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
.unv{color:var(--bad);font-weight:600}
.card{background:#171a21;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
pre{white-space:pre-wrap;font-size:13px;color:var(--tx2)}
.muted{color:var(--tx3);font-size:12px}
</style>
</head>
<body>
<div class="top"><b>Weekly brief</b> <a href="/">draft room</a> <a href="/gameday.html">gameday</a> <a href="/playbook.html">playbook</a></div>
<div class="wrap" id="root"><p>Loading…</p></div>
<script>
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
fetch("/brief.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(b=>{
  const el=document.getElementById("root");
  let h=`<h1>Week ${esc(b.week)}</h1><p class="muted">built ${esc(b.built_at)}</p>`;
  for(const sec of (b.sections||[])){
    const unv=String(sec.status||"").startsWith("UNVERIFIED");
    h+=`<div class="card"><h2>${esc(sec.name)}</h2><p class="${unv?"unv":""}">${esc(sec.status)}</p>`;
    if(sec.fetched_at) h+=`<p class="muted">fetched ${esc(sec.fetched_at)}</p>`;
    if(sec.data) h+=`<pre>${esc(JSON.stringify(sec.data,null,2))}</pre>`;
    h+=`</div>`;
  }
  el.innerHTML=h;
}).catch(()=>{
  document.getElementById("root").innerHTML='<p class="unv">UNVERIFIED — no brief.json. Run <code>python3 src/jobs/weekly_sync.py</code> after filling data/league.json.</p>';
});
</script>
</body>
</html>
