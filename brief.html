<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly brief</title>
<style>
:root{--bg:#0f1115;--tx:#e8eaef;--tx2:#9aa2b1;--tx3:#6b7382;--line:#2a2f3a;--bad:#f85149;--accent:#f0883e;--ok:#3fb950}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
a{color:var(--tx2);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:22px;margin:0 0 6px}
.unv{color:var(--bad);font-weight:600}
.ok{color:var(--ok)}
.card{background:#171a21;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
.muted{color:var(--tx3);font-size:12px}
.banner{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);padding:10px 12px;border-radius:8px;color:#ffb4ae}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
tr.mine td{color:#3fb950;font-weight:600}
ul{margin:8px 0 0;padding-left:18px;color:var(--tx2)}
code{font-size:13px}
</style>
</head>
<body>
<div class="top"><b>Weekly brief</b> <a href="/">draft room</a> <a href="/gameday.html">gameday</a> <a href="/playbook.html">playbook</a></div>
<div class="wrap" id="root"><p>Loading…</p></div>
<script src="/sleeper-live.js"></script>
<script>GuillotineLive.bootBrief(document.getElementById("root"));</script>
</body>
</html>
